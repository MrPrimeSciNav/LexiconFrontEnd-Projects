<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Site</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        table {
            width: 600px;
        }

        th {
            border-top: 1px solid black;
            border-bottom: 2px solid rgb(165, 87, 87);
        }

        tr:nth-child(odd) {
            background-color: rgb(202, 167, 167);
        }

        tr:hover {
            background-color: rgb(182, 106, 153);
        }
    </style>
</head>

<body>
    <table>
        <tr>
            <th>First name</th>
            <th>Last name</th>
        </tr>
        <tr>
            <td>Anna</td>
            <td>Annison</td>
        </tr>
        <tr>
            <td>Jane</td>
            <td>Joe</td>
        </tr>
        <tr>
            <td>Lilly</td>
            <td>Liliac</td>
        </tr>
    </table>
</body>

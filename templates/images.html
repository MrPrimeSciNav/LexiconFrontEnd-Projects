<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery - PrimeSciNavigator</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .gallery img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
    </style>

<body>
    <!-- PNG -->
    <img src="" alt="">
    <hr>
    <!-- JPG -->
    <img src="images/science_logo.jpg" alt="Science Logotype">
    <hr>
    <!-- SVG -->
    <img src="" alt="">
    <hr>
    <!-- GIF -->
    <img src="" alt="">

    <figure>
        <img src="https://picsum.photos/536/354" alt="Winter mountain against the sky">
        <figcaption>"Mountains are invented for moving" - Homer Simpson</figcaption>
    </figure>

</body>

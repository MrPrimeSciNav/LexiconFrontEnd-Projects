<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule - PrimeSciNavigator</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        .schedule {
            width: 100%;
            border-collapse: collapse;
        }

        .schedule th,
        .schedule td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        .schedule th {
            background-color: #f2f2f2;
        }
    </style>
</head>

<!--Form to post "Name", "Email", the users review by "How did you hear ab
<!--Text field to give "Comments"-->
<!--"Sign me up for email updates"-->

<body>
    <h1 class="mt-5">Weekly Schedule - PrimeSciNavigator</h1>
    <form action="/route_for_form" id="scheduleForm" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <!-- Name Input -->
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" class="form-control" id="name" name="name" maxlength="50" required>
        </div>

        <!-- Email Input -->
        <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" class="form-control" id="email" name="email" maxlength="50" required>
        </div>

        <!-- How did you hear about us Dropdown -->
        <div class="mb-3">
            <label for="hearAbout" class="form-label">How did you hear about us?</label>
            <select class="form-select" id="hearAbout" name="hearAbout" required>
                <option value="Social Media">Social Media</option>
                <option value="Friend">Friend</option>
                <option value="Advertisement">Advertisement</option>
                <option value="Other">Other</option>
            </select>
        </div>

        <!-- Comments Textarea -->
        <div class="mb-3">
            <label for="comments" class="form-label">Comments</label>
            <textarea class="form-control" id="comments" name="comments" rows="4" maxlength="400"></textarea>
        </div>

        <!-- Email Updates Checkbox -->
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="emailUpdates" name="emailUpdates">
            <label class="form-check-label" for="emailUpdates">Sign me up for email updates</label>
        </div>
        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</body>
